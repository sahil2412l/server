services:
  - type: web
    name: backend-server
    env: node
    region: singapore # or oregon, frankfurt, etc.
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: "*"
      - key: MONGO_URI
        sync: false # Set in Render Dashboard
