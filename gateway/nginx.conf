events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Logging format with upstream latency
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" upstream_time=$upstream_response_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    keepalive_timeout  65;

    # Rate Limiting Definitions
    # General API limit: 30 requests/second per IP
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;

    # Strict Payment route limit: 5 requests/minute per IP
    limit_req_zone $binary_remote_addr zone=payment_limit:10m rate=5r/m;

    # Upstream Definitions (Service Discovery via Docker internal DNS)
    upstream core_service {
        server server1_core:8001;
        keepalive 32;
    }

    upstream reserved_auth_service {
        server server2_reserved:8002;
        keepalive 16;
    }

    upstream payment_service {
        server server3_payment:8003;
        keepalive 32;
    }

    upstream reserved_analytics_service {
        server server4_reserved:8004;
        keepalive 16;
    }

    upstream ai_service {
        server server5_ai:8005;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost gateway.internal;

        # Global Security Headers (Zero Trust & Hardening)
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # CORS Configuration
        set $cors_origin "*";
        if ($http_origin ~* (https?://.*\.example\.com(:[0-9]+)?$|^https?://localhost(:[0-9]+)?$)) {
            set $cors_origin $http_origin;
        }

        # -------------------------------------------------------------
        # 1. Gateway Health Check
        # -------------------------------------------------------------
        location /health {
            access_log off;
            add_header Content-Type application/json;
            return 200 '{"status":"healthy","service":"api_gateway","timestamp":"$time_iso8601"}';
        }

        # -------------------------------------------------------------
        # 2. Server 1: Core Application API
        # -------------------------------------------------------------
        location /api/v1/core/ {
            limit_req zone=general_limit burst=20 nodelay;

            proxy_pass http://core_service/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        # -------------------------------------------------------------
        # 3. Server 2: Reserved Service (Auth / Notification)
        # -------------------------------------------------------------
        location /api/v1/reserved-auth/ {
            limit_req zone=general_limit burst=10 nodelay;

            proxy_pass http://reserved_auth_service/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # -------------------------------------------------------------
        # 4. Server 3: Payment Service (Strict Security & Rate Limit)
        # -------------------------------------------------------------
        location /api/v1/payments/ {
            # Strict Rate Limiting
            limit_req zone=payment_limit burst=2 nodelay;

            # Only accept POST/GET for payments, block unauthorized methods
            limit_except GET POST {
                deny all;
            }

            proxy_pass http://payment_service/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Stricter timeouts
            proxy_connect_timeout 3s;
            proxy_read_timeout 15s;
        }

        # -------------------------------------------------------------
        # 5. Server 4: Reserved Service (Analytics / Logging)
        # -------------------------------------------------------------
        location /api/v1/reserved-analytics/ {
            limit_req zone=general_limit burst=10 nodelay;

            proxy_pass http://reserved_analytics_service/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # -------------------------------------------------------------
        # 6. Server 5: AI Automation Service
        # -------------------------------------------------------------
        location /api/v1/ai/ {
            limit_req zone=general_limit burst=15 nodelay;

            proxy_pass http://ai_service/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Long read timeout for heavy AI generation
            proxy_connect_timeout 10s;
            proxy_read_timeout 120s;
        }
    }
}
