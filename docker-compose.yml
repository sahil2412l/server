version: '3.8'

services:
  app:
    build: .
    container_name: backend_app
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=development
      - MONGO_URI=mongodb://mongo:27017/secure_backend_db
      - JWT_SECRET=super_secret_jwt_key_change_in_production_123456789!@#$
      - JWT_EXPIRES_IN=7d
      - CORS_ORIGIN=*
    depends_on:
      - mongo
    restart: always

  mongo:
    image: mongo:latest
    container_name: mongodb_container
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: always

volumes:
  mongo_data:
